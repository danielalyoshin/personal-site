<!doctype html>
<!--
  Source of superset-d1-diagram.webp, the Cloudflare D1 tape's diagram:
  how Superset and the D1 packages work together once sqlalchemy-d1 0.2.0
  and Superset PR #44505 are in. `npm run render:diagrams` draws it with the
  site's own fonts and palette; while `npm run dev` runs it can be previewed
  at /src/content/projects/media/superset-d1-diagram.html.

  It is drawn at 360px, the width at which its 14px text still reads at
  11.5px in a 390px phone's reader (296px wide) without being oversized on
  the desktop tube (459px), and rendered at 3.25× so it stays sharp on both.
  It grows down, not across, for the phone's narrow column.

  The drawing is one SVG on a fixed grid, so its wires meet the boxes they
  join exactly:
  - boxes span x 16–324 (Superset's parts 28–312), their text 14px inside;
  - install-time wires (dashed) run down x 42, run-time wires (solid) down
    x 150, each labelled 12px to its right; the engine spec's query path
    takes the rail at x 342, leaving from the row that names it, as a
    rail has no room for a label of its own;
  - a box's name sits 27px under its top edge and its last line 17px above
    its bottom edge; a note follows a name by 21px, a hairline by 13px, and
    rows step 21px, the first 22px under the hairline.
  Every text was measured in its box at render time; keep new labels as
  short. Orange, the tape's label accent, marks what the tape's work
  changed, as the key under the drawing says.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cloudflare D1 in Apache Superset · diagram source</title>
    <script type="module">
      import '@fontsource-variable/archivo/wdth.css'
      import '/src/styles/tokens.css'
    </script>
    <style>
      :root {
        /* The tape's label accent (vhs.accent): what this tape changed. */
        --accent: #ff7a1a;
        --node: color-mix(in srgb, var(--screen-text) 4%, var(--screen-black));
        --line: var(--screen-scroll);
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        background: var(--ink-0);
        padding: 24px;
      }

      .diagram {
        width: 360px;
        padding-bottom: 18px;
        background: var(--screen-black);
        color: var(--screen-soft);
        font-family: var(--font-chassis);
        font-size: 14px;
        line-height: 1.4;
        letter-spacing: var(--tracking-body);
      }

      svg {
        display: block;
        font-family: var(--font-chassis);
        letter-spacing: var(--tracking-body);
      }

      /* Boxes: a part is filled, a boundary only drawn. */
      .part {
        fill: var(--node);
        stroke: var(--seam-lit);
      }

      .part.changed {
        stroke: var(--accent);
      }

      .boundary {
        fill: none;
        stroke: var(--seam-lit);
      }

      .hair {
        stroke: var(--seam);
      }

      text {
        font-size: 14px;
        fill: var(--screen-soft);
      }

      .name {
        font-size: 17px;
        font-weight: 600;
        fill: var(--screen-text);
      }

      .term {
        font-weight: 600;
        fill: var(--screen-text);
      }

      .tag {
        font-weight: 600;
        fill: var(--accent);
      }

      .quiet,
      .label {
        fill: var(--screen-dim);
      }

      .end {
        text-anchor: end;
      }

      /* Wires: what passes between two parts, and when. */
      .wire,
      .head {
        fill: none;
        stroke: var(--line);
        stroke-width: 1.5;
      }

      .wire.install {
        stroke-dasharray: 4 3;
      }

      .key {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 18px;
        margin: 18px 16px 0;
        padding-top: 12px;
        border-top: 1px solid var(--seam);
        color: var(--screen-dim);
      }

      .key span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .key svg {
        flex: none;
      }
    </style>
  </head>
  <body>
    <div class="diagram" id="diagram">
      <svg
        width="360"
        height="735"
        viewBox="0 0 360 735"
        role="img"
        aria-label="How Apache Superset and the D1 packages work together"
      >
        <!-- Apache Superset, with its three parts that take part -->
        <rect
          class="boundary"
          x="16.5"
          y="16.5"
          width="307"
          height="301"
          rx="4"
        />
        <text class="name" x="30" y="43">Apache Superset</text>
        <text class="tag end" x="310" y="43">PR #44505</text>

        <rect
          class="part changed"
          x="28.5"
          y="56.5"
          width="283"
          height="141"
          rx="4"
        />
        <text class="name" x="42" y="83">D1 engine spec</text>
        <text class="quiet end" x="298" y="83">built in</text>
        <path class="hair" d="M42 96.5h256" />
        <text x="42" y="118">Picked for d1:// URLs</text>
        <text x="42" y="139">Fixes DATE filters</text>
        <text x="42" y="160">Strips leading comments</text>
        <text x="42" y="181">Runs SQL on the driver</text>

        <rect class="part" x="28.5" y="208.5" width="283" height="43" rx="4" />
        <text class="name" x="42" y="235">SQLAlchemy</text>
        <text class="quiet end" x="298" y="235">engine and inspector</text>

        <rect
          class="part changed"
          x="28.5"
          y="262.5"
          width="97"
          height="43"
          rx="4"
        />
        <text class="name" x="42" y="289">d1 extra</text>

        <!-- Superset to sqlalchemy-d1: installed by the extra, loaded and
             inspected by the engine -->
        <path class="wire install" d="M42 307v62" />
        <path class="head" d="M37.75 364.75 42 369l4.25-4.25" />
        <text class="label" x="54" y="350">installs</text>

        <path class="wire" d="M150 253v116" />
        <path class="head" d="M145.75 364.75 150 369l4.25-4.25" />
        <text class="label" x="162" y="340">loads the d1 dialect</text>
        <text class="label" x="162" y="360">inspects tables and views</text>

        <!-- sqlalchemy-d1 0.2.0 -->
        <rect
          class="part changed"
          x="16.5"
          y="372.5"
          width="307"
          height="120"
          rx="4"
        />
        <text class="name" x="30" y="399">sqlalchemy-d1 0.2.0</text>
        <text class="tag end" x="310" y="399">Rebuilt</text>
        <text x="30" y="420">Adds what Superset needs</text>
        <path class="hair" d="M30 433.5h280" />
        <text x="30" y="455">The d1:// name</text>
        <text x="176" y="455">Date columns</text>
        <text x="30" y="476">Schemas and views</text>
        <text x="176" y="476">Hides _cf_ tables</text>

        <!-- sqlalchemy-d1 to the community package: requires it, and its
             dialect subclasses the community one -->
        <path class="wire install" d="M42 494v34" />
        <path class="head" d="M37.75 523.75 42 528l4.25-4.25" />
        <text class="label" x="54" y="517">requires</text>

        <path class="wire" d="M150 494v34" />
        <path class="head" d="M145.75 523.75 150 528l4.25-4.25" />
        <text class="label" x="162" y="517">subclasses</text>

        <!-- The engine spec runs Superset's SQL on the driver's cursor: the
             rail leaves from the row that says so and lands on the driver -->
        <path class="wire" d="M312 176h30v454h-17" />
        <path class="head" d="M329.25 625.75 325 630l4.25 4.25" />

        <!-- sqlalchemy-cloudflare-d1 -->
        <rect class="part" x="16.5" y="531.5" width="307" height="120" rx="4" />
        <text class="name" x="30" y="558">sqlalchemy-cloudflare-d1</text>
        <text x="30" y="579">Community package</text>
        <path class="hair" d="M30 592.5h280" />
        <text x="30" y="614">
          <tspan class="term">Dialect</tspan>
          · compiles SQL, reads the URL
        </text>
        <text x="30" y="635">
          <tspan class="term">DB-API driver</tspan>
          · sends SQL with httpx
        </text>

        <!-- The driver to D1 -->
        <path class="wire" d="M150 653v34" />
        <path class="head" d="M145.75 682.75 150 687l4.25-4.25" />
        <text class="label" x="162" y="676">HTTPS · REST API /raw</text>

        <!-- Cloudflare D1 -->
        <rect class="part" x="16.5" y="690.5" width="307" height="43" rx="4" />
        <text class="name" x="30" y="717">Cloudflare D1</text>
        <text class="quiet end" x="310" y="717">Serverless SQLite</text>
      </svg>

      <p class="key">
        <span>
          <svg width="24" height="14" viewBox="0 0 24 14" aria-hidden="true">
            <path class="wire" d="M0 7h24" />
          </svg>
          Run time
        </span>
        <span>
          <svg width="24" height="14" viewBox="0 0 24 14" aria-hidden="true">
            <path class="wire install" d="M0 7h24" />
          </svg>
          Install time
        </span>
        <span>
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
            <rect
              class="part changed"
              x="0.5"
              y="0.5"
              width="13"
              height="13"
              rx="2"
            />
          </svg>
          My changes
        </span>
      </p>
    </div>
  </body>
</html>
