<!doctype html>
<!--
  Source of knobs-diagram-narrow.webp, the knobs tape's diagram as drawn
  for a narrow reading column (windows under 640px wide: phones);
  knobs-diagram.html draws the same system across, for wider readers, and
  says where it comes from. `npm run render:diagrams` draws them with the
  site's own fonts and palette; while `npm run dev` runs this one can be
  previewed at /src/content/projects/media/knobs-diagram-narrow.html.

  It is drawn at 360px, as the D1 narrow diagram is, and grows down, not
  across: the mic's path through OBS's audio engine runs down the page.
  - boxes span x 16–324 (knobs's parts 28–312, the chain 40–300); a pair
    of boxes shares a row where both names fit in half of it;
  - code and settings (dashed) come down x 90 and x 250, each labelled
    12px to its right; the mic's audio (solid) takes the rail at x 342
    from the mic down to the chain's first row, runs down the chain at
    x 150, and leaves it at x 100 for the cable and the apps.
  The knob red marks the parts I wrote, as the key says.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>knobs · narrow diagram source</title>
    <script type="module">
      import '@fontsource-variable/archivo/wdth.css'
      import '/src/styles/tokens.css'
    </script>
    <style>
      :root {
        /* The tape's label accent (vhs.accent): the parts I wrote. */
        --accent: #e5484d;
        --node: color-mix(in srgb, var(--screen-text) 4%, var(--screen-black));
        --line: var(--screen-scroll);
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        background: var(--ink-0);
        padding: 24px;
      }

      .diagram {
        width: 360px;
        padding-bottom: 18px;
        background: var(--screen-black);
        color: var(--screen-soft);
        font-family: var(--font-chassis);
        font-size: 14px;
        line-height: 1.4;
        letter-spacing: var(--tracking-body);
      }

      svg {
        display: block;
        font-family: var(--font-chassis);
        letter-spacing: var(--tracking-body);
      }

      /* Boxes: a part is filled, a boundary only drawn. */
      .part {
        fill: var(--node);
        stroke: var(--seam-lit);
      }

      .part.changed {
        stroke: var(--accent);
      }

      .boundary {
        fill: none;
        stroke: var(--seam-lit);
      }

      .hair {
        stroke: var(--seam);
      }

      text {
        font-size: 14px;
        fill: var(--screen-soft);
      }

      .name {
        font-size: 17px;
        font-weight: 600;
        fill: var(--screen-text);
      }

      .term {
        font-weight: 600;
        fill: var(--screen-text);
      }

      .quiet,
      .label {
        fill: var(--screen-dim);
      }

      .end {
        text-anchor: end;
      }

      /* Wires: what passes between two parts, and when. */
      .wire,
      .head {
        fill: none;
        stroke: var(--line);
        stroke-width: 1.5;
      }

      .wire.setup {
        stroke-dasharray: 4 3;
      }

      .key {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 18px;
        margin: 18px 16px 0;
        padding-top: 12px;
        border-top: 1px solid var(--seam);
        color: var(--screen-dim);
      }

      .key span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .key svg {
        flex: none;
      }
    </style>
  </head>
  <body>
    <div class="diagram" id="diagram">
      <svg
        width="360"
        height="770"
        viewBox="0 0 360 770"
        role="img"
        aria-label="How knobs runs your mic through OBS’s own audio code"
      >
        <!-- The mic, whose audio takes the rail down to the chain -->
        <rect class="part" x="16.5" y="16.5" width="307" height="43" rx="4" />
        <text class="name" x="30" y="43">Your mic</text>
        <path class="wire" d="M325 38h17v364h-39" />
        <path class="head" d="M307.25 397.75 303 402l4.25 4.25" />

        <!-- Where knobs gets OBS's code and your settings -->
        <rect class="part" x="16.5" y="70.5" width="148" height="64" rx="4" />
        <text class="name" x="30" y="97">OBS Studio</text>
        <text x="30" y="118">Your install</text>

        <rect class="part" x="175.5" y="70.5" width="148" height="64" rx="4" />
        <text class="name" x="189" y="97">OBS’s settings</text>
        <text x="189" y="118">Your profile</text>

        <path class="wire setup" d="M90 136v85" />
        <path class="head" d="M85.75 216.75 90 221l4.25-4.25" />
        <text class="label" x="102" y="157">copied once</text>
        <text class="label" x="102" y="175">per version</text>

        <path class="wire setup" d="M250 136v85" />
        <path class="head" d="M245.75 216.75 250 221l4.25-4.25" />
        <text class="label" x="262" y="157">read, never</text>
        <text class="label" x="262" y="175">written</text>

        <!-- knobs, the tray app -->
        <rect
          class="boundary"
          x="16.5"
          y="184.5"
          width="307"
          height="436"
          rx="4"
        />
        <text class="name" x="30" y="211">knobs</text>

        <rect
          class="part changed"
          x="28.5"
          y="224.5"
          width="136"
          height="64"
          rx="4"
        />
        <text class="name" x="42" y="251">Loader</text>
        <text x="42" y="272">Copies OBS</text>

        <rect
          class="part changed"
          x="175.5"
          y="224.5"
          width="136"
          height="64"
          rx="4"
        />
        <text class="name" x="189" y="251">Importer</text>
        <text x="189" y="272">Reads your mic</text>

        <path class="wire setup" d="M90 290v47" />
        <path class="head" d="M85.75 332.75 90 337l4.25-4.25" />
        <text class="label" x="102" y="319">loads</text>

        <path class="wire setup" d="M250 290v47" />
        <path class="head" d="M245.75 332.75 250 337l4.25-4.25" />
        <text class="label" x="262" y="310">rebuilds</text>
        <text class="label" x="262" y="328">your mic</text>

        <!-- libobs, OBS's audio engine, running inside knobs: the mic's
             path through it, top to bottom -->
        <rect
          class="boundary"
          x="28.5"
          y="340.5"
          width="283"
          height="235"
          rx="4"
        />
        <text class="name" x="42" y="367">libobs</text>
        <text class="quiet end" x="298" y="367">OBS’s audio engine</text>

        <rect class="part" x="40.5" y="380.5" width="259" height="43" rx="4" />
        <text class="name" x="54" y="407">Mic input</text>
        <text class="quiet end" x="286" y="407">As set in OBS</text>

        <path class="wire" d="M150 425v22" />
        <path class="head" d="M145.75 442.75 150 447l4.25-4.25" />

        <rect class="part" x="40.5" y="450.5" width="259" height="43" rx="4" />
        <text class="name" x="54" y="477">Filters</text>
        <text class="quiet end" x="286" y="477">Yours, in order</text>

        <path class="wire" d="M150 495v22" />
        <path class="head" d="M145.75 512.75 150 517l4.25-4.25" />

        <rect class="part" x="40.5" y="520.5" width="259" height="43" rx="4" />
        <text class="name" x="54" y="547">Output</text>
        <text class="quiet end" x="286" y="547">Audio monitoring</text>

        <text class="quiet end" x="310" y="604">Pauses while OBS runs</text>

        <!-- Out to the cable and the other apps -->
        <path class="wire" d="M100 565v86" />
        <path class="head" d="M95.75 646.75 100 651l4.25-4.25" />
        <text class="label" x="112" y="640">processed mic</text>

        <rect class="part" x="16.5" y="654.5" width="307" height="43" rx="4" />
        <text class="name" x="30" y="681">Virtual cable</text>

        <path class="wire" d="M100 699v22" />
        <path class="head" d="M95.75 716.75 100 721l4.25-4.25" />
        <text class="label" x="112" y="715">as their mic</text>

        <rect class="part" x="16.5" y="724.5" width="307" height="43" rx="4" />
        <text class="name" x="30" y="751">Other apps</text>
      </svg>

      <p class="key">
        <span>
          <svg width="24" height="14" viewBox="0 0 24 14" aria-hidden="true">
            <path class="wire" d="M0 7h24" />
          </svg>
          Audio
        </span>
        <span>
          <svg width="24" height="14" viewBox="0 0 24 14" aria-hidden="true">
            <path class="wire setup" d="M0 7h24" />
          </svg>
          Code and settings
        </span>
        <span>
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
            <rect
              class="part changed"
              x="0.5"
              y="0.5"
              width="13"
              height="13"
              rx="2"
            />
          </svg>
          My code
        </span>
      </p>
    </div>
  </body>
</html>
