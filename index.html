<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      A dark-only site: the browser paints its own canvas, scrollbars and
      media controls dark from the first frame, and tints its chrome with the
      graphite ground (--ink-0).
    -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0e0f12" />
    <!-- The nameplate's cassette mark (npm run render:icons for the PNG). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="description"
      content="Portfolio of Daniel Alyoshin, design engineer — projects presented as VHS tapes played through a CRT-styled deck."
    />
    <!--
      This title is the home title; Stage.tsx names every other route after
      what is in the deck ("Placeholder: Alpha — Daniel Alyoshin").
    -->
    <title>Daniel Alyoshin — Design Engineer</title>
    <!--
      Share cards. Crawlers read this file as served and run no script, so
      every route unfurls with the site's card. The image is a render of the
      studio itself (npm run render:card). %SITE_URL% is the site's address,
      filled in at build time from the SITE_URL environment variable (see
      vite.config.ts): several crawlers only accept an absolute image URL.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Daniel Alyoshin" />
    <meta property="og:title" content="Daniel Alyoshin — Design Engineer" />
    <meta
      property="og:description"
      content="Portfolio of Daniel Alyoshin, design engineer — projects presented as VHS tapes played through a CRT-styled deck."
    />
    <meta property="og:image" content="%SITE_URL%/social-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A low-poly studio on a graphite table: a CRT monitor reading INSERT TAPE over a VHS deck, beside a rack of cassettes, a speaker, and headphones."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Daniel Alyoshin — Design Engineer" />
    <meta
      name="twitter:description"
      content="Portfolio of Daniel Alyoshin, design engineer — projects presented as VHS tapes played through a CRT-styled deck."
    />
    <meta name="twitter:image" content="%SITE_URL%/social-card.png" />
    <meta
      name="twitter:image:alt"
      content="A low-poly studio on a graphite table: a CRT monitor reading INSERT TAPE over a VHS deck, beside a rack of cassettes, a speaker, and headphones."
    />
    <!--
      Fonts (Archivo Variable wdth + VT323) are self-hosted via @fontsource
      imports in src/main.tsx and bundled by Vite — no external font hosts.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
